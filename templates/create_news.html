<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create News</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background:
            linear-gradient(rgba(15,23,42,0.92), rgba(15,23,42,0.92)),
            url('https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=2070&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px 15px;
            color:white;
        }

        /* MAIN CARD */

        .create-card{
            width:100%;
            max-width:900px;
            background:rgba(15,23,42,0.95);
            backdrop-filter:blur(12px);
            border-radius:30px;
            padding:45px;
            box-shadow:0 15px 45px rgba(0,0,0,0.45);
            border:1px solid rgba(255,255,255,0.08);
        }

        /* HEADER */

        .badge-top{
            display:inline-block;
            padding:8px 18px;
            background:rgba(59,130,246,0.15);
            border:1px solid rgba(59,130,246,0.3);
            color:#60a5fa;
            border-radius:30px;
            font-size:0.85rem;
            margin-bottom:20px;
        }

        .title{
            font-size:2.2rem;
            font-weight:700;
            margin-bottom:10px;
        }

        .subtitle{
            color:#94a3b8;
            margin-bottom:35px;
            line-height:1.7;
        }

        /* FORM */

        form p{
            margin-bottom:22px;
        }

        form label{
            display:block;
            margin-bottom:8px;
            color:#e2e8f0;
            font-weight:500;
        }

        form input,
        form textarea,
        form select{
            width:100%;
            background:#1e293b;
            border:1px solid #334155;
            color:white;
            padding:14px 16px;
            border-radius:14px;
            outline:none;
            transition:0.3s;
        }

        form textarea{
            min-height:160px;
            resize:none;
        }

        form input:focus,
        form textarea:focus,
        form select:focus{
            border-color:#3b82f6;
            box-shadow:0 0 0 4px rgba(59,130,246,0.2);
        }

        /* FILE INPUT */

        input[type="file"]{
            background:#0f172a;
            padding:12px;
        }

        /* BUTTON */

        .publish-btn{
            width:100%;
            border:none;
            padding:15px;
            border-radius:16px;
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            color:white;
            font-size:1rem;
            font-weight:600;
            transition:0.3s;
            margin-top:10px;
        }

        .publish-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(59,130,246,0.35);
        }

        /* RESPONSIVE */

        @media(max-width:768px){

            .create-card{
                padding:28px;
            }

            .title{
                font-size:1.7rem;
            }

            .subtitle{
                font-size:0.95rem;
            }

        }

    </style>

</head>

<body>

    <div class="create-card">

        <span class="badge-top">
            News Publisher Panel
        </span>

        <h2 class="title">
            Create Breaking News
        </h2>

        <p class="subtitle">
            Publish trending news articles with images, categories, and detailed content for your audience.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="publish-btn">
                Publish News
            </button>

        </form>

    </div>

</body>

</html>
