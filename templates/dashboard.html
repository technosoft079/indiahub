{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            min-height:100vh;
        }

        /* NAVBAR */

        .topbar{
            background:rgba(15,23,42,0.95);
            backdrop-filter:blur(10px);
            border-bottom:1px solid rgba(255,255,255,0.08);
            padding:18px 0;
            position:sticky;
            top:0;
            z-index:1000;
        }

        .dashboard-title{
            font-size:2rem;
            font-weight:700;
        }

        .dashboard-title span{
            color:#f59e0b;
        }

        .welcome-text{
            color:#94a3b8;
            margin-top:5px;
        }

        .add-btn{
            background:linear-gradient(135deg,#f59e0b,#ea580c);
            border:none;
            color:white;
            padding:12px 24px;
            border-radius:14px;
            font-weight:600;
            transition:0.3s;
        }

        .add-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(245,158,11,0.3);
        }

        /* DASHBOARD SECTION */

        .dashboard-section{
            padding:50px 0;
        }

        .news-card{
            background:#1e293b;
            border:none;
            border-radius:24px;
            overflow:hidden;
            transition:0.4s;
            height:100%;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .news-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 35px rgba(0,0,0,0.35);
        }

        .news-card img{
            width:100%;
            height:240px;
            object-fit:cover;
        }

        .card-body{
            padding:25px;
        }

        .card-title{
            font-size:1.2rem;
            font-weight:600;
            line-height:1.6;
            margin-bottom:18px;
            color:white;
        }

        /* BUTTONS */

        .btn-custom{
            border:none;
            border-radius:12px;
            padding:10px 16px;
            font-size:0.9rem;
            font-weight:500;
            transition:0.3s;
        }

        .btn-custom:hover{
            transform:translateY(-2px);
        }

        .read-btn{
            background:#334155;
            color:white;
        }

        .edit-btn{
            background:#f59e0b;
            color:white;
        }

        .delete-btn{
            background:#dc2626;
            color:white;
        }

        /* EMPTY STATE */

        .empty-box{
            background:#1e293b;
            border-radius:24px;
            padding:50px 30px;
            text-align:center;
            border:1px solid rgba(255,255,255,0.06);
        }

        .empty-box h3{
            color:white;
            margin-bottom:10px;
        }

        .empty-box p{
            color:#94a3b8;
        }

        /* RESPONSIVE */

        @media(max-width:768px){

            .dashboard-title{
                font-size:1.5rem;
            }

            .topbar .container{
                flex-direction:column;
                gap:20px;
                text-align:center;
            }

            .add-btn{
                width:100%;
            }

            .card-buttons{
                display:flex;
                flex-direction:column;
                gap:10px;
            }

            .btn-custom{
                width:100%;
            }

        }

    </style>

</head>

<body>

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="container d-flex justify-content-between align-items-center">

            <div>

                <h1 class="dashboard-title">
                    Welcome <span>{{ request.user.username }}</span>
                </h1>

                <p class="welcome-text">
                    Manage your latest news articles from your smart dashboard.
                </p>

            </div>

            <a href="{% url 'create_news' %}" class="btn add-btn">
                + Add News
            </a>

        </div>

    </div>

    <!-- DASHBOARD CONTENT -->

    <section class="dashboard-section">

        <div class="container">

            <div class="row g-4">

                {% for item in news %}

                <div class="col-lg-4 col-md-6">

                    <div class="card news-card">

                        <img src="{{ item.image.url }}" class="card-img-top">

                        <div class="card-body">

                            <h5 class="card-title">
                                {{ item.title }}
                            </h5>

                            <div class="d-flex flex-wrap gap-2 card-buttons">

                                <a href="{% url 'news_detail' item.id %}"
                                   class="btn btn-custom read-btn">

                                    Read More

                                </a>

                                <a href="{% url 'update_news' item.id %}"
                                   class="btn btn-custom edit-btn">

                                    Edit

                                </a>

                                <a href="{% url 'delete_news' item.id %}"
                                   class="btn btn-custom delete-btn">

                                    Delete

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

                {% empty %}

                <div class="col-12">

                    <div class="empty-box">

                        <h3>
                            No News Available
                        </h3>

                        <p>
                            Start by creating your first news article.
                        </p>

                    </div>

                </div>

                {% endfor %}

            </div>

        </div>

    </section>

</body>

</html>
