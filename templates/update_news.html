<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update News</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background:
            linear-gradient(rgba(15,23,42,0.9), rgba(15,23,42,0.9)),
            url('https://images.unsplash.com/photo-1495020689067-958852a7765e?q=80&w=2070&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px 15px;
        }

        .update-card{
            width:100%;
            max-width:850px;
            background:rgba(15,23,42,0.95);
            backdrop-filter:blur(10px);
            border-radius:28px;
            padding:40px;
            box-shadow:0 10px 40px rgba(0,0,0,0.5);
            border:1px solid rgba(255,255,255,0.08);
        }

        .title{
            color:white;
            font-size:2rem;
            font-weight:700;
            margin-bottom:8px;
        }

        .subtitle{
            color:#94a3b8;
            margin-bottom:35px;
        }

        /* Django Form Styling */

        form p{
            margin-bottom:22px;
        }

        form label{
            display:block;
            margin-bottom:8px;
            color:#e2e8f0;
            font-weight:500;
        }

        form input,
        form textarea,
        form select{
            width:100%;
            background:#1e293b;
            border:1px solid #334155;
            color:white;
            padding:14px 16px;
            border-radius:14px;
            outline:none;
            transition:0.3s;
        }

        form textarea{
            min-height:140px;
            resize:none;
        }

        form input:focus,
        form textarea:focus,
        form select:focus{
            border-color:#f59e0b;
            box-shadow:0 0 0 4px rgba(245,158,11,0.2);
        }

        /* File Input */

        input[type="file"]{
            background:#0f172a;
            padding:12px;
        }

        /* Button */

        .update-btn{
            width:100%;
            border:none;
            background:linear-gradient(135deg,#f59e0b,#ea580c);
            color:white;
            padding:14px;
            border-radius:14px;
            font-size:1rem;
            font-weight:600;
            transition:0.3s;
            margin-top:10px;
        }

        .update-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(245,158,11,0.3);
        }

        /* Top Badge */

        .top-badge{
            display:inline-block;
            background:rgba(245,158,11,0.15);
            color:#fbbf24;
            padding:8px 18px;
            border-radius:30px;
            font-size:0.85rem;
            margin-bottom:18px;
            border:1px solid rgba(245,158,11,0.3);
        }

        /* Responsive */

        @media(max-width:768px){

            .update-card{
                padding:25px;
            }

            .title{
                font-size:1.6rem;
            }

        }

    </style>

</head>

<body>

    <div class="update-card">

        <span class="top-badge">
            News Management Panel
        </span>

        <h2 class="title">
            Update News Article
        </h2>

        <p class="subtitle">
            Edit your news content, upload images, and publish updated information instantly.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="update-btn">
                Update News
            </button>

        </form>

    </div>

</body>
</html>
